name: direct-matter-android

on:
  push:
    branches: [architecture/m0-foundation]
    paths:
      - .github/workflows/direct-matter-android.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-matter-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Manisa
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout official Matter SDK
        uses: actions/checkout@v4
        with:
          repository: project-chip/connectedhomeip
          ref: v1.5.1.0
          submodules: recursive
          fetch-depth: 1
          path: matter

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;28.2.13676358"

      - name: Install Kotlin compiler
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kotlin.zip" \
            https://github.com/JetBrains/kotlin/releases/download/v2.1.10/kotlin-compiler-2.1.10.zip
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Brand direct test app
        working-directory: matter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('examples/android/CHIPTool/app/src/main/res/values/strings.xml')
          s = p.read_text()
          s = s.replace('<string name="app_name">CHIPTool</string>', '<string name="app_name">Manisa Direct Matter</string>')
          s = s.replace('Provision CHIP device with Wi-Fi', 'Add Matter device over Wi-Fi')
          s = s.replace('Light On/Off &amp; Level Cluster', 'Touch Switch On/Off &amp; Level')
          p.write_text(s)
          PY

      - name: Build official Matter Android controller
        working-directory: matter
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          source scripts/bootstrap.sh
          export PATH="$RUNNER_TEMP/kotlinc/bin:$PATH"
          ./scripts/build/build_examples.py --target android-arm64-chip-tool build

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp matter/out/android-arm64-chip-tool/outputs/apk/debug/app-debug.apk dist/manisa-direct-matter-arm64-debug.apk
          sha256sum dist/manisa-direct-matter-arm64-debug.apk > dist/SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: manisa-direct-matter-apk
          path: |
            dist/manisa-direct-matter-arm64-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
