name: manisa_mobile
description: Manisa local-first smart home mobile application.
publish_to: none
version: 0.31.0+37

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.2"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  mobile_scanner: ^7.4.1
  qr_flutter: ^4.1.0
  multicast_dns: ^0.3.3+1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/manisa-brand-source.png
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
